[project]
name = "clinical-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "langchain>=1.2.10",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=0.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "cachetools>=5.3.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.0.0",
    "sentence-transformers>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "prometheus-client>=0.20",
]

[project.scripts]
clinical-agents = "src.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "BLE", "RUF"]
ignore = [
    "BLE001",   # broad Exception catches are intentional in top-level CLI/server handlers
    "E501",     # line length — existing codebase pre-dates this enforcement; fix separately
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"utils/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
