global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:6333"]

  # Neo4j Community has no native Prometheus endpoint; graph query latency
  # comes from the reasoning API as neo4j_query_duration_seconds.

  - job_name: "ingestion"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "reasoning"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
